# Redis deployment cho Vonia — session store + billing store.
# Áp dụng: kubectl apply -f k8s/redis.yaml
# REDIS_URL trong .env: redis://localhost:30379
#
# NodePort 30379 expose Redis ra host để omnivoice-serve (chạy ngoài k3s) kết nối được.
# Không bật AOF — session mất khi restart là chấp nhận được cho MVP.
apiVersion: v1
kind: Namespace
metadata:
  name: vonia
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vonia
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vonia
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
