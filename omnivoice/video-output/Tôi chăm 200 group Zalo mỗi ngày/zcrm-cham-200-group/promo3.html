<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZCRM Chăm 200 group</title>
<style>
  @font-face{font-family:I400;src:url(fonts/Inter-400-20.ttf)}
  @font-face{font-family:I420;src:url(fonts/Inter-420-20.ttf)}
  @font-face{font-family:I500;src:url(fonts/Inter-500-24.ttf)}
  @font-face{font-family:I580;src:url(fonts/Inter-580-24.ttf)}
  @font-face{font-family:I600;src:url(fonts/Inter-600-20.ttf)}
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;height:100vh;width:auto;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============================================================
   ZCRM Mobile — 30s kể chuyện: một người chăm 200 group Zalo tự động, 9:16. Every colour, font and
   UI string comes from the app source (src/theme/colors/brand.ts,
   src/assets/fonts/Inter-*, src/i18n/vi.json). renderAt(t) is
   deterministic so capture can step it frame by frame.
   ============================================================ */
const W = 1080, H = 1920, DUR = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

// ---- tokens (brand.ts + message components) ----
const T = {
  header: '#1786BE', page: '#F2F4F5', card: '#FFFFFF', navy: '#0E445A', canvas: '#E2E9F1',
  outBg: '#D0F0FE', outBd: '#0D8AFD', inBd: '#D8D8D9', text: '#212121', muted: '#5A6478',
  line: '#E4E8EE', soft: '#F1F4F9', green: '#16A34A', red: '#E13D45', purple: '#6D28D9',
  senderInk: '#3D5A6C', inactive: '#9AA3B2',
};
const f = (w, s) => `${s}px I${w}`;

/* ---------- math ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  inOutExpo: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p * p * p,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outBack: (p, s = 1.70158) => p <= 0 ? 0 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
  outElastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, font, color, align = 'left') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.textAlign = 'left'; }
function wrap(s, font, maxW) {
  ctx.font = font; const out = []; let line = '';
  for (const w of s.split(' ')) {
    const tryL = line ? line + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL;
  }
  if (line) out.push(line); return out;
}
function check(x, y, s, color, lw = 2.2) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .45, y); ctx.lineTo(x - s * .1, y + s * .35); ctx.lineTo(x + s * .5, y - s * .35); ctx.stroke();
}

/* ---------- logo (assets/icon.png, 1024 units) ---------- */
const LG = { x0: 123, x1: 902, y0: 147, y1: 722, r: 110 };
function pathBubble() {
  const { x0, x1, y0, y1, r } = LG;
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0); ctx.lineTo(x1 - r, y0); ctx.arcTo(x1, y0, x1, y0 + r, r);
  ctx.lineTo(x1, y1 - r); ctx.arcTo(x1, y1, x1 - r, y1, r);
  ctx.lineTo(465, y1); ctx.lineTo(310, 878); ctx.lineTo(310, y1);
  ctx.lineTo(x0 + r, y1); ctx.arcTo(x0, y1, x0, y1 - r, r);
  ctx.lineTo(x0, y0 + r); ctx.arcTo(x0, y0, x0 + r, y0, r); ctx.closePath();
}
const Z_PATH = [[293, 252], [730, 252], [730, 330], [497, 565], [730, 565], [730, 641], [293, 641], [293, 565], [527, 330], [293, 330]];
function drawLogo(cx, cy, s, o = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-512, -512);
  ctx.fillStyle = o.bubble || T.navy; pathBubble(); ctx.fill();
  const zp = o.z ?? 1;
  if (zp > 0) {
    ctx.save(); pathBubble(); ctx.clip();
    ctx.translate(512, 446); ctx.scale(zp, zp); ctx.translate(-512, -446);
    ctx.fillStyle = o.zColor || '#FFFFFF'; ctx.beginPath(); Z_PATH.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.fill();
    ctx.restore();
  }
  const dp = o.dot ?? 1;
  if (dp > 0) {
    ctx.fillStyle = o.ring || '#FFFFFF'; ctx.beginPath(); ctx.arc(777, 195, 74 * dp, 0, 7); ctx.fill();
    ctx.fillStyle = o.dotColor || T.header; ctx.beginPath(); ctx.arc(777, 195, 50 * dp, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- icons (MessageSelectionBar.tsx paths, 24 viewBox) ---------- */
const P = {
  cloud: new Path2D('M7 18.5h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 9.1 4.7 4.7 0 0 0 7 18.5Z'),
  share: new Path2D('M14 5.5V9C7.5 9 4.5 12.5 4 18.5c2-3 4.8-4.4 10-4.4V18l6-6.2-6-6.3Z'),
  recall: new Path2D('M8.5 5.5A7.5 7.5 0 1 1 4.6 12M8.5 5.5 5 4.5m3.5 1L7.8 9'),
  trash: new Path2D('M4.5 6.5h15M9.5 6.5V4.8c0-.4.3-.8.8-.8h3.4c.5 0 .8.4.8.8v1.7M6.5 6.5l.8 12.3c0 .7.6 1.2 1.3 1.2h6.8c.7 0 1.2-.5 1.3-1.2l.8-12.3M10 10.5v6M14 10.5v6'),
  spark: new Path2D('M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z'),
  back: new Path2D('M15 5l-7 7 7 7'),
  search: new Path2D('M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM15.5 15.5 20 20'),
  filter: new Path2D('M4 6h16M7 12h10M10 18h4'),
  send: new Path2D('M4 12 20 4l-4 16-4-6-8-2Z'),
  chat: new Path2D('M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z'),
  grid: new Path2D('M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'),
  user: new Path2D('M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5'),
  cal: new Path2D('M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2ZM4 10h16M8 3v4M16 3v4'),
  gear: new Path2D('M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1'),
  group: new Path2D('M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM2.5 19c.6-3 3.2-4.8 6.5-4.8s5.9 1.8 6.5 4.8M16 11a3 3 0 1 0 0-6M17.5 14.5c2.2.4 3.7 2 4 4.5'),
};
function icon(p, x, y, size, color, lw = 1.8, fill = false) {
  ctx.save(); ctx.translate(x - size / 2, y - size / 2); ctx.scale(size / 24, size / 24);
  if (fill) { ctx.fillStyle = color; ctx.fill(p); }
  else { ctx.strokeStyle = color; ctx.lineWidth = lw * 24 / size * (size / 24); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(p); }
  ctx.restore();
}

/* ---------- phone + screen space (dp = app points, 390 wide) ---------- */
const PH = { w: 680, h: 1360, r: 96, b: 17 }; PH.x = (W - PH.w) / 2; PH.y = 500;
const SCR = { x: PH.x + PH.b, y: PH.y + PH.b, w: PH.w - 2 * PH.b, h: PH.h - 2 * PH.b, r: 86 };
const SC = SCR.w / 390, DH = SCR.h / SC;   // dp height ≈ 800
const HEADER_H = 100, TAB_H = 78;

function avatar(x, y, r, seed, initials) {
  const pal = [['#F6C9A8', '#E0916A'], ['#A8D4F6', '#4C9BEA'], ['#C9E7C1', '#5DB36D'], ['#E3C6F2', '#9A6CD6'], ['#F7E0A0', '#E3A93C'], null];
  const g = pal[seed % pal.length];
  if (!g) { ctx.fillStyle = T.navy; } else {
    const gr = ctx.createLinearGradient(x - r, y - r, x + r, y + r); gr.addColorStop(0, g[0]); gr.addColorStop(1, g[1]); ctx.fillStyle = gr;
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  if (initials) txt(initials, x, y + r * .36, f(600, r * .9), '#FFFFFF', 'center');
}
function statusBar(dark) {
  const c = dark ? T.text : '#FFFFFF';
  txt('9:41', 34, 32, f(600, 15), c);
  for (let i = 0; i < 4; i++) { ctx.fillStyle = c; ctx.fillRect(300 + i * 5, 30 - (4 + i * 2.5), 3.2, 4 + i * 2.5); }
  ctx.strokeStyle = c; ctx.lineWidth = 1.2; rr(328, 20, 24, 12, 3.5); ctx.stroke();
  ctx.fillStyle = c; rr(330, 22, 18, 8, 2); ctx.fill();
}
function header(title, opts = {}) {
  ctx.fillStyle = T.header; ctx.fillRect(0, 0, 390, HEADER_H);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, HEADER_H - 1, 390, 1);
  statusBar(false);
  let x = 16;
  if (opts.back) { icon(P.back, 22, 74, 24, '#FFFFFF', 2.2); x = 42; }
  txt(title, x, 80, f(600, 17), '#FFFFFF');
  if (opts.right) opts.right();
}
function tabBar(active, p = 1) {
  const y = DH - TAB_H;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, y, 390, TAB_H); ctx.fillStyle = T.line; ctx.fillRect(0, y, 390, 1);
  const tabs = [[P.grid, 'Tổng quan'], [P.chat, 'Hội thoại'], [P.user, 'Khách hàng'], [P.cal, 'Lịch hẹn'], [P.gear, 'Cài đặt']];
  tabs.forEach(([ic, l], i) => {
    const x = 39 + i * 78, on = i === active, col = on ? T.header : T.inactive;
    icon(ic, x, y + 24, 24, col, 1.8);
    txt(l, x, y + 52, f(on ? 600 : 500, 10.5), col, 'center');
    if (i === 1) { ctx.fillStyle = T.red; ctx.beginPath(); ctx.arc(x + 12, y + 14, 8, 0, 7); ctx.fill(); txt('9', x + 12, y + 18, f(600, 10), '#FFF', 'center'); }
  });
}
function toast(msg, t0, t1, t) {
  const p = E.outBack(seg(t, t0, t0 + .3), 1.6) * (1 - E.inCubic(seg(t, t1 - .25, t1)));
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = cl(p); ctx.font = f(500, 14);
  const w = ctx.measureText(msg).width + 64, x = 195 - w / 2, y = DH - 58 + (1 - p) * 30;
  ctx.fillStyle = 'rgba(33,33,33,.94)'; rr(x, y, w, 44, 22); ctx.fill();
  ctx.fillStyle = T.green; ctx.beginPath(); ctx.arc(x + 24, y + 22, 10, 0, 7); ctx.fill(); check(x + 24, y + 22, 10, '#FFF', 2);
  txt(msg, x + 42, y + 27, f(500, 14), '#FFFFFF');
  ctx.restore();
}
// finger taps (dp coordinates on the screen)
const TAPS = [];
function tap(t0, x, y, long = false) { TAPS.push({ t0, x, y, long }); }
function drawTaps(t) {
  TAPS.forEach(({ t0, x, y, long }) => {
    const d = long ? .8 : .45, q = seg(t, t0 - .12, t0 + d);
    if (q <= 0 || q >= 1) return;
    const press = seg(t, t0 - .12, t0), rel = seg(t, t0, t0 + d);
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${.55 * (1 - rel)})`; ctx.strokeStyle = `rgba(23,134,190,${.7 * (1 - rel)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 20 - 4 * press + rel * 6, 0, 7); ctx.fill(); ctx.stroke();
    if (long) { ctx.strokeStyle = `rgba(23,134,190,${.9 * (1 - rel)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 30, -Math.PI / 2, -Math.PI / 2 + rel * 7); ctx.stroke(); }
    ctx.strokeStyle = `rgba(23,134,190,${.5 * (1 - rel)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 20 + rel * 34, 0, 7); ctx.stroke();
    ctx.restore();
  });
}

/* ================= shared bits ================= */
function photo(x, y, w, h, seed) {
  ctx.save(); rr(x, y, w, h, 12); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, ['#9CC9E8', '#F4C79A', '#BFE3C8'][seed % 3]); g.addColorStop(1, ['#E5F1FA', '#FBE6CF', '#EEF8F0'][seed % 3]);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = ['#5D7F99', '#B97C57', '#5E9A6E'][seed % 3];
  for (let i = 0; i < 4; i++) { const bw = w / 5, bh = h * (.35 + ((i * 37 + seed * 11) % 40) / 100); ctx.fillRect(x + 8 + i * (bw + 4), y + h - bh, bw, bh); }
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) ctx.fillRect(x + 12 + i * (w / 5 + 4), y + h - 12 - j * 14, 5, 6);
  ctx.restore();
}
function btn(label, x, y, w, h, tPress, t, color = T.header) {
  const press = 1 - .05 * Math.sin(Math.PI * seg(t, tPress - .1, tPress + .1));
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(press, press);
  ctx.fillStyle = color; rr(-w / 2, -h / 2, w, h, 14); ctx.fill(); txt(label, 0, 6, f(600, 15), '#FFFFFF', 'center'); ctx.restore();
}
function radio(x, y, on, cp) {
  ctx.strokeStyle = on ? T.header : '#C6CCD8'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.stroke();
  if (cp > 0) { ctx.fillStyle = T.header; ctx.beginPath(); ctx.arc(x, y, 11 * cp, 0, 7); ctx.fill(); check(x, y, 11 * cp, '#FFF', 2); }
}
function tagPill(x, y, s, c, size = 12) {
  ctx.font = f(500, size); const w = ctx.measureText(s).width + 14;
  ctx.fillStyle = rgba(c, .16); rr(x, y - size - 3, w, size + 9, (size + 9) / 2); ctx.fill(); txt(s, x + 7, y, f(500, size), T.text); return x + w + 5;
}
function sheetBase(y0, title) {
  ctx.fillStyle = '#FFFFFF'; rr(0, y0, 390, DH - y0 + 40, [18, 18, 0, 0]); ctx.fill();
  ctx.fillStyle = '#D8DCE3'; rr(175, y0 + 8, 40, 4, 2); ctx.fill();
  txt(title, 16, y0 + 42, f(600, 17), T.text);
}
function groupAvatar(x, y, r, i) {
  ctx.fillStyle = [T.header, '#E3A93C', '#5DB36D', '#9A6CD6', T.navy, '#E0719E', '#4C9BEA'][i % 7];
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); icon(P.group, x, y, r * 1.05, '#FFF', 1.7);
}
const GEAR = new Path2D('M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1');

/* ================= group chat (dùng chung cho chương 1 và 3) =================
   Tin: {id, side:'in'|'out', who, text | img, t0, label?, auto?} hoặc {id, day:'Ngày 3', t0}.
   Nhãn tin gửi đi theo quy tắc app: nhân viên → chấm tên + tên; kịch bản → "Tự động · <tên>". */
const MSG_FONT = f(400, 15), BUBBLE_W = 250;
function msgBox(m) {
  if (m.day) return { w: 0, h: 30, lines: [] };
  if (m.img) return { w: 252, h: 124, lines: [] };
  const lines = wrap(m.text, MSG_FONT, BUBBLE_W - 24);
  ctx.font = MSG_FONT; const w = Math.max(...lines.map(l => ctx.measureText(l).width), 40) + 24;
  return { w: Math.max(w, 76), h: lines.length * 21 + 34, lines };
}
const MEMBER_COL = ['#1786BE', '#C2410C', '#15803D', '#7C3AED', '#BE185D'];
function groupChat(t, cfg) {
  const { msgs, title, sub, select = [], selStart = 99, selEnd = 99, input = null, avatarIdx = 0 } = cfg;
  ctx.fillStyle = T.canvas; ctx.fillRect(0, 0, 390, DH);
  const selP = E.outCubic(seg(t, selStart, selStart + .25)) * (1 - seg(t, selEnd, selEnd + .2));
  const inputH = 44, barH = lerp(inputH + 32, 118, selP);
  const bottom = DH - barH - 8 - (cfg.extraBottom ? cfg.extraBottom(t) : 0);
  const boxes = msgs.map(m => ({ m, b: msgBox(m), p: m.t0 < 0 ? 1 : E.outExpo(seg(t, m.t0, m.t0 + .45)) }));
  let y = bottom; const pos = {};
  for (let i = boxes.length - 1; i >= 0; i--) {
    const { m, b, p } = boxes[i]; if (p <= 0) continue;
    const lh = m.day ? 0 : m.side === 'in' ? 18 : (m.label ? 24 : 0);
    y -= (b.h + lh + 10) * p; pos[m.id] = { y, lh };
  }
  cfg.onLayout && cfg.onLayout(pos);
  boxes.forEach(({ m, b, p }) => {
    const q = pos[m.id]; if (!q || q.y > DH) return;
    ctx.save(); ctx.globalAlpha = p;
    if (m.day) {
      ctx.font = f(600, 12); const w = ctx.measureText(m.day).width + 24;
      ctx.fillStyle = 'rgba(14,68,90,.72)'; rr(195 - w / 2, q.y + 4, w, 24, 12); ctx.fill(); txt(m.day, 195, q.y + 20, f(600, 12), '#FFF', 'center');
      ctx.restore(); return;
    }
    const sel = select.find(([id]) => id === m.id), on = sel && t >= sel[1] && selP > 0;
    if (on) { ctx.fillStyle = 'rgba(23,134,190,.10)'; ctx.fillRect(0, q.y - 4, 390, b.h + q.lh + 8); }
    if (selP > 0 && m.side === 'out') {
      const cy = q.y + q.lh + b.h / 2, cp = sel ? E.outBack(seg(t, sel[1], sel[1] + .3), 2.6) : 0;
      ctx.globalAlpha = p * selP; radio(22, cy, on, on ? cp : 0); ctx.globalAlpha = p;
    }
    const s = lerp(.92, 1, p);
    if (m.side === 'in') {
      const x = 44;
      avatar(x - 22, q.y + q.lh + b.h - 14, 14, m.av ?? 1);
      txt(m.who, x + 2, q.y + 12, f(600, 12), MEMBER_COL[(m.av ?? 1) % 5]);
      ctx.save(); ctx.translate(x, q.y + q.lh); ctx.scale(s, s);
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = T.inBd; ctx.lineWidth = 1; rr(0, 0, b.w, b.h, [4, 16, 16, 16]); ctx.fill(); ctx.stroke();
      b.lines.forEach((l, j) => txt(l, 12, 25 + j * 21, MSG_FONT, T.text));
      txt(m.time || '', 12, b.h - 9, f(400, 11), '#7B858D');
      ctx.restore();
    } else {
      const x = 378 - b.w;
      if (m.label) {
        if (m.auto) {
          icon(GEAR, 378 - 170, q.y + 10, 14, '#B45309', 2);
          txt(m.label, 378 - 158, q.y + 15, f(600, 12), '#B45309');
        } else {
          ctx.fillStyle = '#7FB7D6'; ctx.beginPath(); ctx.arc(378 - 80, q.y + 10, 9, 0, 7); ctx.fill();
          txt('MA', 378 - 80, q.y + 13.5, f(600, 8), '#FFF', 'center'); txt(m.label, 378 - 66, q.y + 15, f(600, 12), T.senderInk);
        }
      }
      ctx.save(); ctx.translate(x + b.w, q.y + q.lh); ctx.scale(s, s); ctx.translate(-b.w, 0);
      if (m.img) { photo(0, 0, 124, 124, 0); photo(128, 0, 124, 124, 1); }
      else {
        ctx.fillStyle = T.outBg; ctx.strokeStyle = T.outBd; ctx.lineWidth = 1; rr(0, 0, b.w, b.h, [16, 4, 16, 16]); ctx.fill(); ctx.stroke();
        b.lines.forEach((l, j) => txt(l, 12, 25 + j * 21, MSG_FONT, T.text));
        txt(m.time || '', b.w - 12, b.h - 9, f(400, 11), '#5B7A8C', 'right');
      }
      ctx.restore();
    }
    ctx.restore();
  });

    ctx.save(); ctx.globalAlpha = cl(p); ctx.translate(x + 89, y + 50); ctx.scale(lerp(.9, 1, cl(p)), lerp(.9, 1, cl(p))); ctx.translate(-89, -50);
    ctx.fillStyle = '#FFF'; rr(0, 0, 178, 100, 16); ctx.fill();
    wrap(l, f(500, 12.5), 150).forEach((s, j) => txt(s, 14, 24 + j * 16, f(500, 12.5), T.muted));
    txt(String(v), 14, 84, f(600, 32), c); ctx.restore();
  });
  const lp = E.outExpo(seg(t, 25.0, 25.4));
  ctx.save(); ctx.globalAlpha = lp; ctx.translate(0, (1 - lp) * 30);
  ctx.fillStyle = '#FFF'; rr(12, 348, 366, 230, 16); ctx.fill();
  txt('Cần bạn trả lời', 28, 380, f(600, 15), T.text);
  [['Quốc Bảo', 'Cho mình xin giá căn 2PN', 'Lake View'], ['Lan Chi', 'Gửi mình bảng giá căn 2PN với', 'Căn hộ Q7'], ['Diệu Linh', 'Cuối tuần mình đăng ký xem nhà', 'Lake View']].forEach(([n, m, g], i) => {
    const y = 400 + i * 58; avatar(44, y + 22, 18, i + 2);
    txt(n, 72, y + 17, f(600, 14), T.text); txt(m, 72, y + 36, f(400, 12.5), T.muted); txt(g, 362, y + 17, f(500, 11), T.header, 'right');
  });

}

/* ================= flying chips ================= */
const EMITS = [];
SENT_GROUPS.forEach((g, i) => EMITS.push({ t0: 14.9 + i * .3, s: g, side: i % 2 ? -1 : 1, y: 900 + (i % 3) * 170, group: true }));
[['Ngày 1 · đã tự đăng', 20.75], ['Ngày 3 · đã tự đăng', 21.95], ['Ngày 5 · đã tự đăng', 23.15]].forEach(([s, t0], i) => EMITS.push({ t0, s, side: i % 2 ? -1 : 1, y: 1000 + i * 150, day: true }));
function drawEmits(t) {
  EMITS.forEach(e => {
    const p = seg(t, e.t0, e.t0 + 1.3); if (p <= 0 || p >= 1) return;
    const m = E.outCubic(p), a = Math.sin(Math.PI * Math.min(1, p * 1.4)) * (1 - seg(p, .75, 1));
    ctx.font = f(600, 24); const w = ctx.measureText(e.s).width + 72;
    let x = e.side > 0 ? PH.x + PH.w - 150 + m * 110 : PH.x + 150 - w - m * 110; const y = e.y - m * 60;
    x = Math.max(18, Math.min(W - 18 - w, x));
    ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = 'rgba(14,68,90,.25)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#FFF'; rr(x, y - 30, w, 60, 30); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = e.day ? '#B45309' : T.green; ctx.beginPath(); ctx.arc(x + 32, y, 17, 0, 7); ctx.fill();
    if (e.group) icon(P.group, x + 32, y, 20, '#FFF', 1.8); else icon(GEAR, x + 32, y, 20, '#FFF', 2);
    txt(e.s, x + 58, y + 8, f(600, 24), T.text); ctx.restore();
  });
}
/* ================= compositing the phone ================= */
function push(t, t0, from, to) {
  const p = E.inOutExpo(seg(t, t0, t0 + .45));
  if (p <= 0) { from(t); return; }
  if (p >= 1) { to(t); return; }
  ctx.save(); ctx.translate(-120 * p, 0); from(t); ctx.fillStyle = `rgba(0,0,0,${.2 * p})`; ctx.fillRect(0, 0, 390, DH); ctx.restore();
  ctx.save(); ctx.translate(390 * (1 - p), 0);
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 30; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 390, DH); ctx.shadowColor = 'transparent';
  to(t); ctx.restore();
}


function screenAt(t) {
  if (t < 17.95) return push(t, 17.45, screenGroup1, screenGroupFlow);
  if (t < 20.8) return push(t, 20.3, screenGroupFlow, screenGroup3);
  return push(t, 24.45, screenGroup3, screenDay);
}
function drawPhone(t, ox, oy, s, rot) {
  ctx.save();
  ctx.translate(W / 2 + ox, PH.y + PH.h / 2 + oy); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-W / 2, -(PH.y + PH.h / 2));
  // body + shadow
  ctx.save(); ctx.shadowColor = 'rgba(14,68,90,.35)'; ctx.shadowBlur = 90; ctx.shadowOffsetY = 40;
  ctx.fillStyle = '#10161C'; rr(PH.x, PH.y, PH.w, PH.h, PH.r); ctx.fill(); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 3; rr(PH.x + 3, PH.y + 3, PH.w - 6, PH.h - 6, PH.r - 3); ctx.stroke();
  ctx.fillStyle = '#1C252D'; rr(PH.x - 5, PH.y + 300, 6, 110, 3); ctx.fill(); rr(PH.x + PH.w - 1, PH.y + 360, 6, 170, 3); ctx.fill();
  // screen
  ctx.save(); rr(SCR.x, SCR.y, SCR.w, SCR.h, SCR.r); ctx.clip();
  ctx.translate(SCR.x, SCR.y); ctx.scale(SC, SC);
  screenAt(t); drawTaps(t);
  ctx.restore();
  // island + glare
  ctx.fillStyle = '#000'; rr(W / 2 - 110, SCR.y + 20, 220, 62, 31); ctx.fill();
  const g = ctx.createLinearGradient(PH.x, PH.y, PH.x + PH.w, PH.y + PH.h * .6);
  g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; rr(SCR.x, SCR.y, SCR.w, SCR.h, SCR.r); ctx.fill();
  ctx.restore();
}

/* ================= stage copy ================= */
const FEATS = [
  { t0: 3.0, t1: 9.5, a: '7:30 · Soạn đúng 1 tin', b: 'ngay trong group chính',
    steps: [[3.1, 'Gõ và gửi như chat bình thường'], [6.5, 'Chọn tin vừa gửi, bấm Chia sẻ']] },
  { t0: 9.5, t1: 17.5, a: 'Chia sẻ tới 200 group', b: '2 lượt, mỗi lượt 100',
    steps: [[9.6, 'Lọc group theo tag'], [12.2, 'Lượt 2: 100 group còn lại'], [14.45, 'Tự rải lịch theo hạn mức nick']] },
  { t0: 17.5, t1: 24.5, a: 'Group mới vào?', b: 'gắn kịch bản chăm tự động',
    steps: [[17.6, 'Chọn kịch bản dựng sẵn'], [20.4, 'Tự đăng đúng lịch từng ngày']] },
  { t0: 24.5, t1: 26.5, a: '18:00 · 200 group', b: 'đều đã được chăm',
    steps: [[24.55, 'Tôi chỉ việc trả lời khách']] },
];
function glyphs(str, cx, base, font, color, tIn, tOut, t, stagger = .022) {
  ctx.font = font; const total = ctx.measureText(str).width, x0 = cx - total / 2, chars = [...str];
  const size = parseFloat(font);
  ctx.save(); ctx.beginPath(); ctx.rect(0, base - size * 1.2, W, size * 1.55); ctx.clip(); ctx.fillStyle = color;
  chars.forEach((ch, i) => {
    const pin = E.outExpo(seg(t, tIn + i * stagger, tIn + i * stagger + .55));
    const pout = E.inExpo(seg(t, tOut + i * .008, tOut + i * .008 + .25));
    if (pin <= 0 || pout >= 1) return;
    const pre = ctx.measureText(chars.slice(0, i).join('')).width;
    ctx.fillText(ch, x0 + pre, base + (1 - pin) * size * 1.25 - pout * size * 1.3);
  });
  ctx.restore();
}
function stage(t) {
  ctx.fillStyle = T.page; ctx.fillRect(0, 0, W, H);
  [[140, 560, T.header, .16, 1], [960, 1500, '#5CC8F0', .16, -1], [900, 300, T.header, .08, 1]].forEach(([x, y, c, a, d]) => {
    const ox = Math.sin(t * .6 + x) * 50 * d, g = ctx.createRadialGradient(x + ox, y, 0, x + ox, y, 620);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(1, rgba(c, 0)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  ctx.fillStyle = rgba(T.navy, .06);
  for (let y = 30; y < H; y += 44) for (let x = 30; x < W; x += 44) ctx.fillRect(x - 1, y - 1, 2.2, 2.2);
  const fi = FEATS.findIndex(F => t >= F.t0 && t < F.t1);
  // giant index behind the phone
  if (fi >= 0) {
    const F = FEATS[fi], p = E.outExpo(seg(t, F.t0, F.t0 + .6)), q = E.inCubic(seg(t, F.t1 - .3, F.t1));
    ctx.save(); ctx.globalAlpha = p * (1 - q); ctx.font = f(600, 560); ctx.lineWidth = 3; ctx.strokeStyle = rgba(T.header, .16);
    ctx.textAlign = 'right'; ctx.strokeText(String(fi + 1).padStart(2, '0'), W + 40 - (1 - p) * 80, 1330); ctx.textAlign = 'left'; ctx.restore();
  }
}
function copy(t) {
  const n = FEATS.length, segW = (W - 120 - (n - 1) * 12) / n;
  const ca = seg(t, 2.9, 3.3) * (1 - seg(t, 26.4, 26.7));
  const fi = FEATS.findIndex(F => t >= F.t0 && t < F.t1);
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca;
    FEATS.forEach((F, i) => {
      const x = 60 + i * (segW + 12);
      ctx.fillStyle = rgba(T.navy, .14); rr(x, 64, segW, 6, 3); ctx.fill();
      ctx.fillStyle = T.header; rr(x, 64, segW * seg(t, F.t0, F.t1), 6, 3); ctx.fill();
    });
    drawLogo(88, 140, .058);
    txt('ZCRM', 126, 152, f(600, 34), T.navy); txt('Mobile', 228, 152, f(500, 34), T.header);
    if (fi >= 0) txt(`${String(fi + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}`, W - 60, 150, f(500, 28), T.muted, 'right');
    ctx.restore();
  }
  FEATS.forEach(F => {
    if (t < F.t0 - .1 || t > F.t1 + .1) return;
    glyphs(F.a, W / 2, 262, f(600, 64), T.navy, F.t0 + .05, F.t1 - .28, t);
    glyphs(F.b, W / 2, 340, f(600, 64), T.header, F.t0 + .15, F.t1 - .24, t);
  });
  // step pill: ① ② ③ inside the chapter
  if (fi >= 0) {
    const F = FEATS[fi]; let si = -1; F.steps.forEach(([s], i) => { if (t >= s) si = i; });
    if (si >= 0) {
      const [s0, label] = F.steps[si], p = E.outBack(seg(t, s0, s0 + .35), 1.8), q = E.inCubic(seg(t, F.t1 - .25, F.t1));
      ctx.font = f(600, 30); const w = ctx.measureText(label).width + 104;
      ctx.save(); ctx.globalAlpha = cl(p) * (1 - q); ctx.translate(W / 2, 428); ctx.scale(lerp(.85, 1, cl(p)), lerp(.85, 1, cl(p)));
      ctx.shadowColor = 'rgba(14,68,90,.14)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
      ctx.fillStyle = '#FFFFFF'; rr(-w / 2, -32, w, 64, 32); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.fillStyle = T.header; ctx.beginPath(); ctx.arc(-w / 2 + 34, 0, 22, 0, 7); ctx.fill();
      txt(String(si + 1), -w / 2 + 34, 10, f(600, 26), '#FFF', 'center');
      txt(label, -w / 2 + 70, 10, f(600, 30), T.navy);
      // dots showing how many steps this chapter has
      F.steps.forEach((_, i) => { ctx.fillStyle = i <= si ? T.header : rgba(T.navy, .2); ctx.beginPath(); ctx.arc(-(F.steps.length - 1) * 9 + i * 18, 50, 4.5, 0, 7); ctx.fill(); });
      ctx.restore();
    }
  }
}

/* ================= intro (0 → 3): câu chuyện bắt đầu ================= */
function intro(t) {
  ctx.fillStyle = T.page; ctx.fillRect(0, 0, W, H);
  const flood = E.inOutExpo(seg(t, .02, .45));
  ctx.fillStyle = T.header; ctx.beginPath(); ctx.arc(W / 2, H / 2, 20 + flood * 1200, 0, 7); ctx.fill();
  // 200 group = 200 chấm, nhấp nháy như thông báo dồn dập
  for (let i = 0; i < 200; i++) {
    const c = i % 20, r = Math.floor(i / 20), x = 120 + c * 44.2, y = 300 + r * 44;
    const p = E.outBack(seg(t, .2 + (c + r) * .018, .45 + (c + r) * .018), 2.2);
    if (p <= 0) continue;
    const blink = t > 1.4 ? .5 + .5 * Math.sin(t * 9 + i * 1.7) : 1;
    ctx.fillStyle = `rgba(255,255,255,${.85 * blink})`; ctx.beginPath(); ctx.arc(x, y, 13 * p, 0, 7); ctx.fill();
    if ((i * 37) % 11 === 0 && t > .9) { ctx.fillStyle = T.red; ctx.beginPath(); ctx.arc(x + 9, y - 9, 6 * cl(seg(t, .9 + (i % 7) * .06, 1.1 + (i % 7) * .06)), 0, 7); ctx.fill(); }
  }
  txt('200', W / 2, 820, f(600, 40), 'rgba(255,255,255,0)', 'center');
  glyphs('Tôi chăm 200 group', W / 2, 910, f(600, 96), '#FFFFFF', .35, 99, t, .025);
  glyphs('Zalo mỗi ngày.', W / 2, 1025, f(600, 96), '#FFFFFF', .6, 99, t, .025);
  const sp = E.outCubic(seg(t, 1.2, 1.6));
  txt('Trước đây: vào từng group, dán từng tin…', W / 2, 1130 + (1 - sp) * 24, f(500, 40), `rgba(255,255,255,${.8 * sp})`, 'center');
  glyphs('Giờ thì khác.', W / 2, 1300, f(600, 96), T.navy, 1.9, 99, t, .03);
}

/* ================= CTA (26.5 → 30) ================= */
function cta(t) {
  const fl = E.inOutExpo(seg(t, 26.45, 27.0));
  ctx.fillStyle = T.header; ctx.beginPath(); ctx.arc(W / 2, 560, fl * 2300, 0, 7); ctx.fill();
  if (t < 26.8) return;
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let y = 30; y < H; y += 44) for (let x = 30; x < W; x += 44) ctx.fillRect(x - 1, y - 1, 2.2, 2.2);
  const lp = E.outElastic(seg(t, 26.9, 27.6));
  drawLogo(W / 2, 330, .3 * lp, { bubble: '#FFFFFF', zColor: T.header, ring: T.header, dotColor: T.navy });
  glyphs('Muốn chăm group như tôi?', W / 2, 640, f(600, 72), '#FFFFFF', 27.05, 99, t, .02);
  // a tiny Zalo-style exchange
  const b1 = E.outBack(seg(t, 27.45, 27.8), 1.6);
  if (b1 > 0) {
    ctx.save(); ctx.globalAlpha = cl(b1); ctx.translate(W - 110, 790); ctx.scale(b1, b1);
    ctx.font = f(400, 36); const s = 'Cho mình xin bản trial nhé!', w = ctx.measureText(s).width + 56;
    ctx.fillStyle = T.outBg; ctx.strokeStyle = T.outBd; ctx.lineWidth = 2; rr(-w, -46, w, 92, [34, 8, 34, 34]); ctx.fill(); ctx.stroke();
    txt(s, -w + 28, 13, f(400, 36), T.text); ctx.restore();
  }
  const typing = seg(t, 27.9, 28.35), b2 = E.outBack(seg(t, 28.35, 28.7), 1.6);
  if (typing > 0 && b2 <= 0) {
    ctx.fillStyle = '#FFFFFF'; rr(110, 880, 150, 84, [8, 34, 34, 34]); ctx.fill();
    for (let i = 0; i < 3; i++) { ctx.fillStyle = rgba(T.muted, .7); ctx.beginPath(); ctx.arc(150 + i * 34, 922 + Math.sin(t * 14 - i) * 6, 9, 0, 7); ctx.fill(); }
  }
  if (b2 > 0) {
    ctx.save(); ctx.globalAlpha = cl(b2); ctx.translate(110, 922); ctx.scale(b2, b2);
    ctx.font = f(400, 36); const s = 'Dạ, ZCRM gửi anh/chị ngay ạ!', w = ctx.measureText(s).width + 56;
    ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = T.inBd; ctx.lineWidth = 2; rr(0, -46, w, 92, [8, 34, 34, 34]); ctx.fill(); ctx.stroke();
    txt(s, 28, 13, f(400, 36), T.text); ctx.restore();
  }
  // the ask
  const bp = E.outBack(seg(t, 28.7, 29.1), 1.8);
  if (bp > 0) {
    const cy = 1250;
    for (let k = 0; k < 3; k++) {
      const q = ((t - 29.0 - k * .33) % 1 + 1) % 1;
      if (t < 29.0 + k * .33) continue;
      ctx.strokeStyle = `rgba(255,255,255,${.5 * (1 - q)})`; ctx.lineWidth = 4;
      rr(W / 2 - 380 - q * 60, cy - 90 - q * 60, 760 + q * 120, 180 + q * 120, 90 + q * 60); ctx.stroke();
    }
    const press = 1 - .05 * Math.sin(Math.PI * seg(t, 29.35, 29.55));
    ctx.save(); ctx.translate(W / 2, cy); ctx.scale(bp * press, bp * press);
    ctx.shadowColor = 'rgba(14,68,90,.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    ctx.fillStyle = '#FFFFFF'; rr(-380, -90, 760, 180, 90); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = T.header; ctx.beginPath(); ctx.arc(-270, 0, 58, 0, 7); ctx.fill();
    icon(P.chat, -270, 2, 60, '#FFFFFF', 2.2);
    txt('INBOX NGAY', 40, 24, f(600, 72), T.header, 'center');
    ctx.restore();
    const sp = E.outCubic(seg(t, 28.95, 29.4));
    txt('để nhận bản dùng thử ZCRM', W / 2, 1440 + (1 - sp) * 20, f(500, 46), `rgba(255,255,255,${sp})`, 'center');
    // finger
    const fp = seg(t, 29.15, 29.35), rel = seg(t, 29.55, 29.9);
    if (fp > 0) {
      const fx = W / 2 + 300, fy = 1300 + (1 - E.outCubic(fp)) * 200 + rel * 30;
      ctx.save(); ctx.globalAlpha = (1 - rel * .6);
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.strokeStyle = T.navy; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(fx, fy, 30, 0, 7); ctx.fill(); ctx.stroke();
      if (t > 29.45) { const r = seg(t, 29.45, 29.9); ctx.strokeStyle = `rgba(255,255,255,${1 - r})`; ctx.beginPath(); ctx.arc(fx, fy, 30 + r * 70, 0, 7); ctx.stroke(); }
      ctx.restore();
    }
  }
  const fe = E.outCubic(seg(t, 29.05, 29.5));
  if (fe > 0) {
    ctx.font = f(500, 32); const items = ['100 group/lượt', 'Tự rải hạn mức', 'Kịch bản group'], gap = 44;
    const ws = items.map(s => ctx.measureText(s).width + 40), tot = ws.reduce((a, b) => a + b) + gap * 2;
    let x = W / 2 - tot / 2;
    items.forEach((s, i) => {
      ctx.save(); ctx.globalAlpha = fe; ctx.translate(0, (1 - fe) * 20);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(x + 14, 1590, 14, 0, 7); ctx.fill(); check(x + 14, 1590, 14, T.header, 3.5);
      txt(s, x + 40, 1601, f(500, 32), '#FFFFFF'); ctx.restore(); x += ws[i] + gap;
    });
  }
  const cr = E.outCubic(seg(t, 29.2, 29.7));
  txt('ZCRM · Mọi tin nhắn. Một màn hình.', W / 2, 1760, f(500, 30), `rgba(255,255,255,${.7 * cr})`, 'center');
}

/* ================= master ================= */
function phoneMotion(t) {
  const rise = E.outExpo(seg(t, 3.0, 3.7));
  const out = E.inExpo(seg(t, 26.3, 26.85));
  let bump = 0; FEATS.forEach(F => { const q = seg(t, F.t0, F.t0 + .5); if (q > 0 && q < 1) bump += Math.sin(q * Math.PI) * (1 - q); });
  return { ox: Math.sin(t * .7) * 8, oy: (1 - rise) * 1500 + out * 1500, s: 1 - .025 * bump, rot: Math.sin(t * .55) * .012 + (1 - rise) * .12 - out * .1 };
}
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < 3.0) { intro(t); return; }
  stage(t);
  const m = phoneMotion(t);
  if (t < 26.9) { drawPhone(t, m.ox, m.oy, m.s, m.rot); drawEmits(t); }
  copy(t);
  const lift = E.inOutExpo(seg(t, 3.0, 3.5));
  if (lift < 1) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H * (1 - lift)); ctx.clip(); ctx.translate(0, -H * lift * .5); intro(t); ctx.restore(); }
  if (t >= 26.45) cta(t);
}
window.renderAt = renderAt;
window.ready = (async () => {
  await Promise.all([400, 420, 500, 580, 600].map(w => document.fonts.load(`20px I${w}`, 'Mọi tin nhắn Ắ')));
  await document.fonts.ready; return true;
})();
if (!location.search.includes('capture')) {
  window.ready.then(() => { const t0 = performance.now(); (function loop(now) { renderAt(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); })(t0); });
}
