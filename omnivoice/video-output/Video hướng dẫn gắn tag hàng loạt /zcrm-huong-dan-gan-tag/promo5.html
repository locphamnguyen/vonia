<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZCRM Hướng dẫn gắn tag</title>
<style>
  @font-face{font-family:I400;src:url(fonts/Inter-400-20.ttf)}
  @font-face{font-family:I420;src:url(fonts/Inter-420-20.ttf)}
  @font-face{font-family:I500;src:url(fonts/Inter-500-24.ttf)}
  @font-face{font-family:I580;src:url(fonts/Inter-580-24.ttf)}
  @font-face{font-family:I600;src:url(fonts/Inter-600-20.ttf)}
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;height:100vh;width:auto;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============================================================
   ZCRM — 57s hướng dẫn case study BĐS: tạo tag có màu, gắn tag hàng loạt cho khách & group, lọc theo tag — tất cả trên app. 9:16. Every colour, font and
   UI string comes from the app source (src/theme/colors/brand.ts,
   src/assets/fonts/Inter-*, src/i18n/vi.json). renderAt(t) is
   deterministic so capture can step it frame by frame.
   ============================================================ */
const W = 1080, H = 1920, DUR = 57;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

// ---- tokens (brand.ts + message components) ----
const T = {
  header: '#1786BE', page: '#F2F4F5', card: '#FFFFFF', navy: '#0E445A', canvas: '#E2E9F1',
  outBg: '#D0F0FE', outBd: '#0D8AFD', inBd: '#D8D8D9', text: '#212121', muted: '#5A6478',
  line: '#E4E8EE', soft: '#F1F4F9', green: '#16A34A', red: '#E13D45', purple: '#6D28D9',
  senderInk: '#3D5A6C', inactive: '#9AA3B2',
};
const f = (w, s) => `${s}px I${w}`;

/* ---------- math ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  inOutExpo: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p * p * p,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outBack: (p, s = 1.70158) => p <= 0 ? 0 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
  outElastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, font, color, align = 'left') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.textAlign = 'left'; }
function wrap(s, font, maxW) {
  ctx.font = font; const out = []; let line = '';
  for (const w of s.split(' ')) {
    const tryL = line ? line + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL;
  }
  if (line) out.push(line); return out;
}
function check(x, y, s, color, lw = 2.2) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .45, y); ctx.lineTo(x - s * .1, y + s * .35); ctx.lineTo(x + s * .5, y - s * .35); ctx.stroke();
}

/* ---------- logo (assets/icon.png, 1024 units) ---------- */
const LG = { x0: 123, x1: 902, y0: 147, y1: 722, r: 110 };
function pathBubble() {
  const { x0, x1, y0, y1, r } = LG;
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0); ctx.lineTo(x1 - r, y0); ctx.arcTo(x1, y0, x1, y0 + r, r);
  ctx.lineTo(x1, y1 - r); ctx.arcTo(x1, y1, x1 - r, y1, r);
  ctx.lineTo(465, y1); ctx.lineTo(310, 878); ctx.lineTo(310, y1);
  ctx.lineTo(x0 + r, y1); ctx.arcTo(x0, y1, x0, y1 - r, r);
  ctx.lineTo(x0, y0 + r); ctx.arcTo(x0, y0, x0 + r, y0, r); ctx.closePath();
}
const Z_PATH = [[293, 252], [730, 252], [730, 330], [497, 565], [730, 565], [730, 641], [293, 641], [293, 565], [527, 330], [293, 330]];
function drawLogo(cx, cy, s, o = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-512, -512);
  ctx.fillStyle = o.bubble || T.navy; pathBubble(); ctx.fill();
  const zp = o.z ?? 1;
  if (zp > 0) {
    ctx.save(); pathBubble(); ctx.clip();
    ctx.translate(512, 446); ctx.scale(zp, zp); ctx.translate(-512, -446);
    ctx.fillStyle = o.zColor || '#FFFFFF'; ctx.beginPath(); Z_PATH.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.fill();
    ctx.restore();
  }
  const dp = o.dot ?? 1;
  if (dp > 0) {
    ctx.fillStyle = o.ring || '#FFFFFF'; ctx.beginPath(); ctx.arc(777, 195, 74 * dp, 0, 7); ctx.fill();
    ctx.fillStyle = o.dotColor || T.header; ctx.beginPath(); ctx.arc(777, 195, 50 * dp, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- icons (MessageSelectionBar.tsx paths, 24 viewBox) ---------- */
const P = {
  cloud: new Path2D('M7 18.5h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 9.1 4.7 4.7 0 0 0 7 18.5Z'),
  share: new Path2D('M14 5.5V9C7.5 9 4.5 12.5 4 18.5c2-3 4.8-4.4 10-4.4V18l6-6.2-6-6.3Z'),
  recall: new Path2D('M8.5 5.5A7.5 7.5 0 1 1 4.6 12M8.5 5.5 5 4.5m3.5 1L7.8 9'),
  trash: new Path2D('M4.5 6.5h15M9.5 6.5V4.8c0-.4.3-.8.8-.8h3.4c.5 0 .8.4.8.8v1.7M6.5 6.5l.8 12.3c0 .7.6 1.2 1.3 1.2h6.8c.7 0 1.2-.5 1.3-1.2l.8-12.3M10 10.5v6M14 10.5v6'),
  spark: new Path2D('M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z'),
  back: new Path2D('M15 5l-7 7 7 7'),
  search: new Path2D('M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM15.5 15.5 20 20'),
  filter: new Path2D('M4 6h16M7 12h10M10 18h4'),
  send: new Path2D('M4 12 20 4l-4 16-4-6-8-2Z'),
  chat: new Path2D('M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z'),
  grid: new Path2D('M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'),
  user: new Path2D('M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5'),
  cal: new Path2D('M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2ZM4 10h16M8 3v4M16 3v4'),
  gear: new Path2D('M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1'),
  group: new Path2D('M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM2.5 19c.6-3 3.2-4.8 6.5-4.8s5.9 1.8 6.5 4.8M16 11a3 3 0 1 0 0-6M17.5 14.5c2.2.4 3.7 2 4 4.5'),
};
function icon(p, x, y, size, color, lw = 1.8, fill = false) {
  ctx.save(); ctx.translate(x - size / 2, y - size / 2); ctx.scale(size / 24, size / 24);
  if (fill) { ctx.fillStyle = color; ctx.fill(p); }
  else { ctx.strokeStyle = color; ctx.lineWidth = lw * 24 / size * (size / 24); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(p); }
  ctx.restore();
}

/* ---------- phone + screen space (dp = app points, 390 wide) ---------- */
const PH = { w: 680, h: 1360, r: 96, b: 17 }; PH.x = (W - PH.w) / 2; PH.y = 500;
const SCR = { x: PH.x + PH.b, y: PH.y + PH.b, w: PH.w - 2 * PH.b, h: PH.h - 2 * PH.b, r: 86 };
const SC = SCR.w / 390, DH = SCR.h / SC;   // dp height ≈ 800
const HEADER_H = 100, TAB_H = 78;

function avatar(x, y, r, seed, initials) {
  const pal = [['#F6C9A8', '#E0916A'], ['#A8D4F6', '#4C9BEA'], ['#C9E7C1', '#5DB36D'], ['#E3C6F2', '#9A6CD6'], ['#F7E0A0', '#E3A93C'], null];
  const g = pal[seed % pal.length];
  if (!g) { ctx.fillStyle = T.navy; } else {
    const gr = ctx.createLinearGradient(x - r, y - r, x + r, y + r); gr.addColorStop(0, g[0]); gr.addColorStop(1, g[1]); ctx.fillStyle = gr;
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  if (initials) txt(initials, x, y + r * .36, f(600, r * .9), '#FFFFFF', 'center');
}
function statusBar(dark) {
  const c = dark ? T.text : '#FFFFFF';
  txt('9:41', 34, 32, f(600, 15), c);
  for (let i = 0; i < 4; i++) { ctx.fillStyle = c; ctx.fillRect(300 + i * 5, 30 - (4 + i * 2.5), 3.2, 4 + i * 2.5); }
  ctx.strokeStyle = c; ctx.lineWidth = 1.2; rr(328, 20, 24, 12, 3.5); ctx.stroke();
  ctx.fillStyle = c; rr(330, 22, 18, 8, 2); ctx.fill();
}
function header(title, opts = {}) {
  ctx.fillStyle = T.header; ctx.fillRect(0, 0, 390, HEADER_H);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, HEADER_H - 1, 390, 1);
  statusBar(false);
  let x = 16;
  if (opts.back) { icon(P.back, 22, 74, 24, '#FFFFFF', 2.2); x = 42; }
  txt(title, x, 80, f(600, 17), '#FFFFFF');
  if (opts.right) opts.right();
}
function tabBar(active, p = 1) {
  const y = DH - TAB_H;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, y, 390, TAB_H); ctx.fillStyle = T.line; ctx.fillRect(0, y, 390, 1);
  const tabs = [[P.grid, 'Tổng quan'], [P.chat, 'Hội thoại'], [P.user, 'Khách hàng'], [P.cal, 'Lịch hẹn'], [P.gear, 'Cài đặt']];
  tabs.forEach(([ic, l], i) => {
    const x = 39 + i * 78, on = i === active, col = on ? T.header : T.inactive;
    icon(ic, x, y + 24, 24, col, 1.8);
    txt(l, x, y + 52, f(on ? 600 : 500, 10.5), col, 'center');
    if (i === 1) { ctx.fillStyle = T.red; ctx.beginPath(); ctx.arc(x + 12, y + 14, 8, 0, 7); ctx.fill(); txt('9', x + 12, y + 18, f(600, 10), '#FFF', 'center'); }
  });
}
function toast(msg, t0, t1, t) {
  const p = E.outBack(seg(t, t0, t0 + .3), 1.6) * (1 - E.inCubic(seg(t, t1 - .25, t1)));
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = cl(p); ctx.font = f(500, 14);
  const w = ctx.measureText(msg).width + 64, x = 195 - w / 2, y = DH - 58 + (1 - p) * 30;
  ctx.fillStyle = 'rgba(33,33,33,.94)'; rr(x, y, w, 44, 22); ctx.fill();
  ctx.fillStyle = T.green; ctx.beginPath(); ctx.arc(x + 24, y + 22, 10, 0, 7); ctx.fill(); check(x + 24, y + 22, 10, '#FFF', 2);
  txt(msg, x + 42, y + 27, f(500, 14), '#FFFFFF');
  ctx.restore();
}
// finger taps (dp coordinates on the screen)
const TAPS = [];
function tap(t0, x, y, long = false) { TAPS.push({ t0, x, y, long }); }
function drawTaps(t) {
  TAPS.forEach(({ t0, x, y, long }) => {
    const d = long ? .8 : .45, q = seg(t, t0 - .12, t0 + d);
    if (q <= 0 || q >= 1) return;
    const press = seg(t, t0 - .12, t0), rel = seg(t, t0, t0 + d);
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${.55 * (1 - rel)})`; ctx.strokeStyle = `rgba(23,134,190,${.7 * (1 - rel)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 20 - 4 * press + rel * 6, 0, 7); ctx.fill(); ctx.stroke();
    if (long) { ctx.strokeStyle = `rgba(23,134,190,${.9 * (1 - rel)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 30, -Math.PI / 2, -Math.PI / 2 + rel * 7); ctx.stroke(); }
    ctx.strokeStyle = `rgba(23,134,190,${.5 * (1 - rel)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 20 + rel * 34, 0, 7); ctx.stroke();
    ctx.restore();
  });
}

/* ================= shared bits ================= */
function photo(x, y, w, h, seed) {
  ctx.save(); rr(x, y, w, h, 12); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, ['#9CC9E8', '#F4C79A', '#BFE3C8'][seed % 3]); g.addColorStop(1, ['#E5F1FA', '#FBE6CF', '#EEF8F0'][seed % 3]);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = ['#5D7F99', '#B97C57', '#5E9A6E'][seed % 3];
  for (let i = 0; i < 4; i++) { const bw = w / 5, bh = h * (.35 + ((i * 37 + seed * 11) % 40) / 100); ctx.fillRect(x + 8 + i * (bw + 4), y + h - bh, bw, bh); }
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) ctx.fillRect(x + 12 + i * (w / 5 + 4), y + h - 12 - j * 14, 5, 6);
  ctx.restore();
}
function btn(label, x, y, w, h, tPress, t, color = T.header) {
  const press = 1 - .05 * Math.sin(Math.PI * seg(t, tPress - .1, tPress + .1));
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(press, press);
  ctx.fillStyle = color; rr(-w / 2, -h / 2, w, h, 14); ctx.fill(); txt(label, 0, 6, f(600, 15), '#FFFFFF', 'center'); ctx.restore();
}
function radio(x, y, on, cp) {
  ctx.strokeStyle = on ? T.header : '#C6CCD8'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.stroke();
  if (cp > 0) { ctx.fillStyle = T.header; ctx.beginPath(); ctx.arc(x, y, 11 * cp, 0, 7); ctx.fill(); check(x, y, 11 * cp, '#FFF', 2); }
}
function tagPill(x, y, s, c, size = 12) {
  ctx.font = f(500, size); const w = ctx.measureText(s).width + 14;
  ctx.fillStyle = rgba(c, .16); rr(x, y - size - 3, w, size + 9, (size + 9) / 2); ctx.fill(); txt(s, x + 7, y, f(500, size), T.text); return x + w + 5;
}
function sheetBase(y0, title) {
  ctx.fillStyle = '#FFFFFF'; rr(0, y0, 390, DH - y0 + 40, [18, 18, 0, 0]); ctx.fill();
  ctx.fillStyle = '#D8DCE3'; rr(175, y0 + 8, 40, 4, 2); ctx.fill();
  txt(title, 16, y0 + 42, f(600, 17), T.text);
}
function groupAvatar(x, y, r, i) {
  ctx.fillStyle = [T.header, '#E3A93C', '#5DB36D', '#9A6CD6', T.navy, '#E0719E', '#4C9BEA'][i % 7];
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); icon(P.group, x, y, r * 1.05, '#FFF', 1.7);
}
const GEAR = new Path2D('M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1');

const MEMBER_COL = ['#1786BE', '#C2410C', '#15803D', '#7C3AED', '#BE185D'];
/* ================= dữ liệu case study (minh hoạ) ================= */
// Bảng màu app: 8 màu app Zalo render đúng + xám mặc định (src/constants/tagColors.ts)
const TAG_CHOICES = ['#D91B1B', '#0068FF', '#FF6905', '#4BC377', '#FAC000', '#F31BC8', '#6F3FCF', '#FF6B6B', '#90A4AE'];
const TAGC = { 'Đầu tư': '#FF6905', 'Mua để ở': '#4BC377', 'Thuê': '#6F3FCF', 'Dưới 3 tỷ': '#90A4AE', '3–5 tỷ': '#0068FF', 'Trên 5 tỷ': '#F31BC8', 'Hot lead': '#FAC000', 'Cộng đồng Q7': '#FF6B6B' };
function webPill(x, y, name, col, size = 17) {
  ctx.font = f(600, size); const w = ctx.measureText(name).width + 24, h = size + 14;
  ctx.fillStyle = rgba(col, .13); ctx.strokeStyle = col; ctx.lineWidth = 1.5; rr(x, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
  txt(name, x + 12, y + size * .36, f(600, size), col); return x + w;
}
function chip(x, y, name, size = 11) {   // chip tag trên hàng hội thoại (dp)
  const col = TAGC[name] || T.muted; ctx.font = f(600, size); const w = ctx.measureText(name).width + 14;
  ctx.fillStyle = rgba(col, .14); rr(x, y - size - 3, w, size + 9, (size + 9) / 2); ctx.fill(); txt(name, x + 7, y, f(600, size), col); return x + w + 5;
}

/* ================= mở đầu: case study + vấn đề (0 → 9) ================= */
const NEEDS = [
  ['Anh Minh Quân', 'Căn này cho thuê lại được bao nhiêu/tháng?', 'Đầu tư'],
  ['Chị Thu Hà', 'Nhà 4 người, cần 3PN gần trường học', 'Mua để ở'],
  ['Chị Lan Chi', 'Thuê căn 2PN tầm 15 triệu được không?', 'Thuê'],
  ['Anh Tuấn Kiệt', 'Lợi suất cho thuê dự án này bao nhiêu?', 'Đầu tư'],
  ['Chị Bảo Ngọc', 'Có căn nào bàn giao trong năm không?', 'Mua để ở'],
  ['Anh Đức Anh', 'Tầm 3–5 tỷ nên chọn căn nào để đầu tư?', 'Đầu tư'],
];
function introStory(t) {
  ctx.fillStyle = T.page; ctx.fillRect(0, 0, W, H);
  [[140, 560, T.header, .14], [960, 1500, '#5CC8F0', .14]].forEach(([x, y, c, a]) => { const g = ctx.createRadialGradient(x, y, 0, x, y, 620); g.addColorStop(0, rgba(c, a)); g.addColorStop(1, rgba(c, 0)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); });
  // tiêu đề case study
  const c0 = E.outBack(seg(t, .1, .45), 1.8);
  ctx.save(); ctx.globalAlpha = cl(c0); ctx.translate(W / 2, 250); ctx.scale(cl(c0, 0, 1.1), cl(c0, 0, 1.1));
  ctx.font = f(600, 28); const cw = ctx.measureText('CASE STUDY · BẤT ĐỘNG SẢN').width + 60;
  ctx.fillStyle = T.navy; rr(-cw / 2, -30, cw, 60, 30); ctx.fill(); txt('CASE STUDY · BẤT ĐỘNG SẢN', 0, 10, f(600, 28), '#FFF', 'center'); ctx.restore();
  glyphs('Sàn căn hộ An Phát', W / 2, 410, f(600, 92), T.navy, .3, 4.6, t);
  const st = E.outCubic(seg(t, .8, 1.2)) * (1 - seg(t, 4.5, 4.8));
  txt('6 sale · 12 nick Zalo · 1.800 khách · 45 group', W / 2, 490 + (1 - st) * 20, f(500, 38), rgba(T.header, st), 'center');
  // bong bóng nhu cầu lộn xộn
  NEEDS.forEach(([n, m], i) => {
    const p = E.outBack(seg(t, 1.3 + i * .18, 1.7 + i * .18), 1.6), out = seg(t, 4.5, 4.9);
    if (p <= 0 || out >= 1) return;
    const x = [70, 330, 110, 380, 60, 300][i], y = 640 + i * 150 + Math.sin(t * 2 + i) * 6, rot = [-.04, .03, -.02, .04, .02, -.03][i];
    ctx.save(); ctx.globalAlpha = cl(p) * (1 - out); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(cl(p, 0, 1.1), cl(p, 0, 1.1));
    ctx.font = f(400, 30); const w = ctx.measureText(m).width + 56;
    ctx.shadowColor = 'rgba(14,68,90,.18)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#FFF'; rr(0, 0, w, 96, [8, 30, 30, 30]); ctx.fill(); ctx.shadowColor = 'transparent';

  copy(t);
  if (t >= CTA_START) cta(t);
}
window.renderAt = renderAt;
window.ready = (async () => {

})();
if (!location.search.includes('capture')) {

}
